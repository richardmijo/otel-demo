services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-otel-demo
    hostname: kafka
    ports:
      - "29092:29092"

    environment:
      # Identificación del nodo Kafka
      KAFKA_NODE_ID: 1

      # Kafka trabajará como broker y controller.
      # Esto corresponde al modo KRaft, sin ZooKeeper.
      KAFKA_PROCESS_ROLES: broker,controller

      # Listener interno para Docker, externo para la computadora
      # y listener exclusivo para el controller.
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092, EXTERNAL://0.0.0.0:29092, CONTROLLER://0.0.0.0:9093

      # Direcciones que Kafka comunica a sus clientes.
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:9092, EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración necesaria para trabajar con un solo broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger-otel-demo

    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

    environment:
      COLLECTOR_OTLP_ENABLED: "true"
